name: Dovud o'zini yaxshilaydi

# Dovud ilovasi "dovud-improve" yoki "dovud-rollback" belgili so'rov (issue) ochganda ishga tushadi.
# Faqat repo egasi ochgan so'rovlar qabul qilinadi.
on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: improve
  cancel-in-progress: false

jobs:
  improve:
    if: github.event.issue.user.login == github.repository_owner && contains(github.event.issue.labels.*.name, 'dovud-improve')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.ai.outputs.changed }}
      summary: ${{ steps.ai.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: AI kodni o'zgartiradi va tekshiradi
        id: ai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMPROVE_MODEL: ${{ vars.IMPROVE_MODEL || 'gpt-5.4-mini' }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 tools/ai_improve.py
      - name: Qulflangan fayllar o'zgarmaganini tekshirish
        if: steps.ai.outputs.changed == 'true'
        run: |
          if git diff --name-only | grep -E '(/safety/|^\.github/|^tools/)'; then
            echo "::error::Qulflangan fayllar o'zgartirilgan — rad etildi"; exit 1; fi
      - name: Saqlash
        if: steps.ai.outputs.changed == 'true'
        run: |
          git config user.name "dovud-bot"
          git config user.email "dovud-bot@users.noreply.github.com"
          git add -A app
          git commit -m "Dovud yaxshilanishi: ${{ github.event.issue.title }} (#${{ github.event.issue.number }})"
          git push
      - name: Natija haqida yozish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.ai.outputs.changed }}" = "true" ]; then
            gh issue comment ${{ github.event.issue.number }} --body "✅ O'zgartirildi va yig'ilmoqda: ${{ steps.ai.outputs.summary }}"
          else
            gh issue comment ${{ github.event.issue.number }} --body "❌ Avtomatik yaxshilab bo'lmadi. Loglarni ko'ring."
          fi

  release:
    needs: improve
    if: needs.improve.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: main
      notes: ${{ needs.improve.outputs.summary }}
    secrets: inherit

  rollback:
    if: github.event.issue.user.login == github.repository_owner && contains(github.event.issue.labels.*.name, 'dovud-rollback')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Oxirgi bot o'zgarishini bekor qilish
        run: |
          git config user.name "dovud-bot"
          git config user.email "dovud-bot@users.noreply.github.com"
          C=$(git log --author=dovud-bot --format=%H -n 1)
          if [ -z "$C" ]; then echo "Bekor qilinadigan o'zgarish yo'q"; exit 1; fi
          git revert --no-edit $C
          git push

  rollback-release:
    needs: rollback
    uses: ./.github/workflows/build.yml
    with:
      ref: main
      notes: "Oldingi versiyaga qaytarildi"
    secrets: inherit
